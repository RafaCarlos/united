# FRAGMENTO OPCIONAL — Apache 2.4.10+; contexto .htaccess da RAIZ.
# Rafael deve mesclar com o .htaccess existente, nunca substituí-lo por este arquivo.
# Inserir redirects antes das regras antigas/front controller; resolver conflitos.
# Nenhuma regra altera PHP, RD Station, CSP ou roteamento interno do WordPress.
# Confirmar AllowOverride FileInfo e os módulos abaixo na hospedagem.
# Referências: httpd.apache.org/docs/2.4/{mod/mod_rewrite.html,rewrite/flags.html}

<IfModule mod_rewrite.c>
    RewriteEngine On

    # Consolidar os arquivos index.html públicos nas quatro URLs canônicas.
    # THE_REQUEST limita a regra a pedidos externos: DirectoryIndex não cria loop.
    RewriteCond %{HTTP_HOST} ^(?:www\.)?unitedidiomas\.com(?::(?:80|443))?$ [NC]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+index\.html(?:[?\s]) [NC]
    RewriteRule ^index\.html$ https://www.unitedidiomas.com/ [R=301,L]

    RewriteCond %{HTTP_HOST} ^(?:www\.)?unitedidiomas\.com(?::(?:80|443))?$ [NC]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+(?:cursos|quem-somos|faq)/index\.html(?:[?\s]) [NC]
    RewriteRule ^(cursos|quem-somos|faq)/index\.html$ https://www.unitedidiomas.com/$1/ [R=301,L]

    # Cada destino é literal e corresponde a conteúdo atual. GET/HEAD apenas;
    # POST e os demais métodos continuam sob responsabilidade da aplicação.
    # NE preserva o # das âncoras; a query string original é mantida pelo Apache.
    RewriteCond %{HTTP_HOST} ^(?:www\.)?unitedidiomas\.com(?::(?:80|443))?$ [NC]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteRule ^escola-ingles-united-idiomas/?$ https://www.unitedidiomas.com/quem-somos/ [R=301,L,NE]

    RewriteCond %{HTTP_HOST} ^(?:www\.)?unitedidiomas\.com(?::(?:80|443))?$ [NC]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteRule ^(?:cursos-de-ingles-unitedidiomas|o-melhor-curso-de-ingles|cursos/curso-de-ingles-online)/?$ https://www.unitedidiomas.com/cursos/#live-class [R=301,L,NE]

    RewriteCond %{HTTP_HOST} ^(?:www\.)?unitedidiomas\.com(?::(?:80|443))?$ [NC]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteRule ^unidades-united-idiomas/?$ https://www.unitedidiomas.com/quem-somos/#unidades-hibridas [R=301,L,NE]

    RewriteCond %{HTTP_HOST} ^(?:www\.)?unitedidiomas\.com(?::(?:80|443))?$ [NC]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteRule ^unidades/curso-de-ingles-(cornelio-procopio|ipiranga|maringa|osasco|santo-amaro|tatuape)/?$ https://www.unitedidiomas.com/quem-somos/#unidade-$1 [R=301,L,NE]

    # Só as três páginas comerciais conhecidas; nenhuma regra genérica de barra.
    RewriteCond %{HTTP_HOST} ^(?:www\.)?unitedidiomas\.com(?::(?:80|443))?$ [NC]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteRule ^(cursos|quem-somos|faq)$ https://www.unitedidiomas.com/$1/ [R=301,L]

    # Domínio canônico somente no site comercial. Blog possui configuração
    # própria sem www; prévias e localhost não recebem este redirecionamento.
    RewriteCond %{HTTP_HOST} ^unitedidiomas\.com(?::(?:80|443))?$ [NC]
    RewriteCond %{REQUEST_URI} !^/(?:blog|review)(?:/|$) [NC]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteRule ^ https://www.unitedidiomas.com%{REQUEST_URI} [R=301,L]

    # OPCIONAL: descomentar somente se HTTPS terminar diretamente neste Apache.
    # Atrás de CDN/proxy, configurar detecção de TLS confiável no VirtualHost;
    # não confiar indiscriminadamente em X-Forwarded-Proto enviado pelo cliente.
    # Ativar sem essa confirmação pode provocar loop HTTPS -> HTTPS.
    # RewriteCond %{HTTP_HOST} ^www\.unitedidiomas\.com(?::(?:80|443))?$ [NC]
    # RewriteCond %{REQUEST_URI} !^/(?:blog|review)(?:/|$) [NC]
    # RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    # RewriteCond %{HTTPS} !=on
    # RewriteRule ^ https://www.unitedidiomas.com%{REQUEST_URI} [R=301,L]

    # URLs sem equivalente confirmado estão em redirects.json / needs_review.
    # Remover redirects antigos dessas URLs para a Home somente após decidir
    # restauração/substituto real ou encerramento (404/410). Não há catch-all.
</IfModule>

<IfModule mod_headers.c>
    # Proteção delimitada às áreas não públicas; não aplica noindex ao comercial.
    # Não é controle de acesso. O robô precisa rastrear para ler X-Robots-Tag.
    Header always set X-Robots-Tag "noindex, nofollow" "expr=%{REQUEST_URI} =~ m#^/(?:review|comparar-contato)(?:/|$)#"

    # Revalidar HTML sem enfraquecer no-store/private já definidos pela aplicação.
    # WordPress mantém sua própria política de cache.
    Header setifempty Cache-Control "no-cache" "expr=%{CONTENT_TYPE} =~ m#^text/html(?:;|$)# && %{REQUEST_URI} !~ m#^/blog(?:/|$)#"

    # Só CSS cujo nome inclui hash de conteúdo: 1 ano, immutable.
    # Somente respostas válidas; não guardar 404 de arquivos removidos por 1 ano.
    Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_STATUS} =~ m#^(200|304)$# && %{REQUEST_METHOD} =~ m#^(GET|HEAD)$# && %{REQUEST_URI} =~ m#^/assets/css/page-[a-z0-9-]+-[a-f0-9]{12}\.css$# && %{CONTENT_TYPE} !~ m#^text/html(?:;|$)# && resp('Cache-Control') !~ m#(?:^|,)\s*(?:private|no-store)(?:[=,\s]|$)#i"

    # Imagens/fontes sem hash: 1 semana, sem immutable. Ao substituir a mesma
    # URL, invalidar cache/CDN ou usar URL versionada para atualização imediata.
    Header set Cache-Control "public, max-age=604800" "expr=%{REQUEST_STATUS} =~ m#^(200|304)$# && %{REQUEST_METHOD} =~ m#^(GET|HEAD)$# && %{REQUEST_URI} =~ m#^/assets/(?:images|banners|fonts)/[^?]+\.(?:webp|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$# && %{CONTENT_TYPE} !~ m#^text/html(?:;|$)# && resp('Cache-Control') !~ m#(?:^|,)\s*(?:private|no-store)(?:[=,\s]|$)#i"

    # Após a regra genérica: variantes geradas têm largura e hash SHA-256/12
    # no NOME. Novo conteúdo recebe nova URL; manter os nomes sem renomeá-los.
    Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_STATUS} =~ m#^(200|304)$# && %{REQUEST_METHOD} =~ m#^(GET|HEAD)$# && %{REQUEST_URI} =~ m#^/assets/(?:images|banners)/responsive/[a-z0-9-]+-[1-9][0-9]*w-[a-f0-9]{12}\.webp$# && %{CONTENT_TYPE} !~ m#^text/html(?:;|$)# && resp('Cache-Control') !~ m#(?:^|,)\s*(?:private|no-store)(?:[=,\s]|$)#i"

    # JavaScript próprio: apenas nomes conhecidos e query EXATA v=hash/12.
    # A query é separada de REQUEST_URI no Apache. Uma semana, sem immutable:
    # a hospedagem/CDN deve preservar a query na chave de cache, e cada edição
    # exige regenerar o hash no HTML. Não inclui scripts remotos de RD/GTM.
    # setifempty conserva no-store/private e outras políticas da aplicação.
    Header setifempty Cache-Control "public, max-age=604800" "expr=%{REQUEST_STATUS} =~ m#^(200|304)$# && %{REQUEST_METHOD} =~ m#^(GET|HEAD)$# && %{REQUEST_URI} =~ m#^/(?:assets/js/dist/scripts(?:-core)?|preview|responsive-home|benefits|rdstation-form|rdstation-whatsapp|contact-preview|site-refinement|shared-header|media-runtime)\.js$# && %{QUERY_STRING} =~ m#^v=[a-f0-9]{12}$# && %{CONTENT_TYPE} !~ m#^text/html(?:;|$)#"
    Header setifempty Cache-Control "no-cache" "expr=%{REQUEST_URI} =~ m#^/(?:assets/js/dist/scripts(?:-core)?|preview|responsive-home|benefits|rdstation-form|rdstation-whatsapp|contact-preview|site-refinement|shared-header|media-runtime)\.js$#"

    # Vídeos locais sem hash: uma semana, sem immutable. Respostas parciais
    # (206), erros e conteúdo privado conservam a política do servidor.
    Header setifempty Cache-Control "public, max-age=604800" "expr=%{REQUEST_STATUS} =~ m#^(200|304)$# && %{REQUEST_METHOD} =~ m#^(GET|HEAD)$# && %{REQUEST_URI} =~ m#^/assets/videos/[a-zA-Z0-9._-]+\.(?:mp4|webm)$# && %{CONTENT_TYPE} !~ m#^text/html(?:;|$)#"
</IfModule>

<IfModule mod_deflate.c>
    <IfModule mod_filter.c>
        # Sem recompressão de WebP, WOFF2 e vídeos. O blog mantém sua configuração.
        <If "%{REQUEST_URI} !~ m#^/blog(?:/|$)#">
            AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml
        </If>
    </IfModule>
</IfModule>
