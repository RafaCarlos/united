<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#012858">
  <title>Obrigado pelo contato! | United Idiomas</title>
  <style>
    @font-face{font-family:Manrope;src:url('../assets/fonts/Manrope-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:Manrope;src:url('../assets/fonts/Manrope-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
    .united-thanks{box-sizing:border-box;min-height:100vh;min-height:100svh;margin:0;padding:clamp(24px,6vw,72px);display:grid;place-items:center;background:#012858;color:#fff;font:400 16px/1.6 Manrope,Arial,sans-serif;text-align:center}
    .united-thanks *{box-sizing:border-box}
    .united-thanks main{width:100%;max-width:580px}
    .united-thanks .brand{display:inline-block;margin-bottom:clamp(44px,8vh,80px)}
    .united-thanks .brand img{display:block;width:180px;max-width:100%;height:auto}
    .united-thanks h1{margin:0 0 18px;font-size:clamp(30px,6vw,44px);font-weight:700;line-height:1.2;letter-spacing:-.035em}
    .united-thanks p{max-width:440px;margin:0 auto 32px;color:#dbe7f5;font-size:18px;line-height:1.65}
    .united-thanks .back{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:14px 28px;border-radius:999px;background:#d90050;color:#fff;font-weight:700;text-decoration:none}
    .united-thanks .back:hover{background:#be0046}
    .united-thanks a:focus-visible{outline:3px solid #ffabc9;outline-offset:6px}
  </style>
</head>
<body class="united-thanks">
  <main>
    <a class="brand" href="../" aria-label="United Idiomas — página inicial"><img src="../assets/images/logo-united-idiomas.png" width="258" height="163" alt="United Idiomas"></a>
    <h1>Obrigado pelo contato!</h1>
    <p>Sua solicitação foi enviada. Nossa equipe entrará em contato com você.</p>
    <a class="back" href="../">Voltar ao site</a>
  </main>
</body>
</html>
