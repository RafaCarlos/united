# FRAGMENTO ADITIVO. Contexto: .htaccess da raiz, Apache 2.4.
# Mesclar acima das regras legadas de redirecionamento/front controller.
# Nao substituir o .htaccess existente; nao instalar no /blog/.htaccess.
# Manter antes deste trecho autenticacao e bloqueios de seguranca existentes.
<IfModule mod_rewrite.c>
    RewriteEngine On

    # Um salto para o curso atual. Destino literal; query original preservada.
    # GET/HEAD apenas: POST, formulários e integrações mantêm o fluxo existente.
    RewriteCond %{HTTP_HOST} ^(?:www\.)?unitedidiomas\.com(?::(?:80|443))?$ [NC]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteRule ^(?:cursos-de-ingles-unitedidiomas|o-melhor-curso-de-ingles|cursos/curso-de-ingles-online)/?$ https://www.unitedidiomas.com/cursos/live-class/ [R=301,L]

    # /cursos e /cursos/ vão ao comparativo real da Home, sem DirectorySlash.
    # Com query, construir explicitamente ?query#ancora. A propagacao implicita
    # do Apache colocaria ?query DEPOIS da ancora e perderia os parametros UTM.
    # NE conserva escapes existentes (%2F, %23) e o # literal. Nao usar QSA/QSD.
    RewriteCond %{HTTP_HOST} ^(?:www\.)?unitedidiomas\.com(?::(?:80|443))?$ [NC]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{QUERY_STRING} !^$
    RewriteRule ^cursos/?$ https://www.unitedidiomas.com/?%{QUERY_STRING}#comparar-cursos [R=301,L,NE]

    # Sem query: destino limpo, sem ? vazio.
    RewriteCond %{HTTP_HOST} ^(?:www\.)?unitedidiomas\.com(?::(?:80|443))?$ [NC]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteRule ^cursos/?$ https://www.unitedidiomas.com/#comparar-cursos [R=301,L,NE]
</IfModule>
