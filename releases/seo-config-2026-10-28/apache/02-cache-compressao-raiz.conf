# FRAGMENTO ADITIVO, opcional e independente dos redirects.
# Mesclar ao .htaccess da raiz APOS inspecionar as politicas existentes.
# Apache 2.4.10+; AllowOverride FileInfo. Nao substitui configuracao de seguranca.
# Apenas arquivos estaticos reais nas pastas comerciais conhecidas.
# O blog, painel, PHP, endpoints e scripts RD Station nao recebem cache aqui.
# setifempty e a verificacao de resposta preservam politicas existentes.
# Nenhuma regra usa immutable. A CDN deve incluir a query na chave de cache.
<IfModule mod_headers.c>
    # CSS/JS: 1 dia; nomes estaveis precisam de nova query v=hash a cada edicao.
    Header setifempty Cache-Control "public, max-age=86400" "expr=%{REQUEST_STATUS} =~ m#^(200|304)$# && %{REQUEST_METHOD} =~ m#^(GET|HEAD)$# && %{HTTP_HOST} =~ m#^(?:www\.)?unitedidiomas\.com(?::(?:80|443))?$#i && %{REQUEST_URI} =~ m#^/(?:home/(?:assets/[^?]+|[a-zA-Z0-9._-]+)|assets/[^?]+|contact-form|footer|site-navigation)\.(?:css|js)$# && %{REQUEST_URI} !~ m#(?:^|/)(?:rdstation|rd-station)[^/]*#i && %{REQUEST_FILENAME} =~ m#\.(?:css|js)$# && -f %{REQUEST_FILENAME} && %{CONTENT_TYPE} =~ m#^(?:text/css|text/javascript|application/javascript)(?:;|$)# && -z req('Authorization') && -z resp('Set-Cookie') && -z resp('Cache-Control')"

    # Imagens/fontes: 30 dias; usar URL nova ou purgar CDN ao trocar o conteudo.
    Header setifempty Cache-Control "public, max-age=2592000" "expr=%{REQUEST_STATUS} =~ m#^(200|304)$# && %{REQUEST_METHOD} =~ m#^(GET|HEAD)$# && %{HTTP_HOST} =~ m#^(?:www\.)?unitedidiomas\.com(?::(?:80|443))?$#i && %{REQUEST_URI} =~ m#^/(?:home/assets|assets)/[^?]+\.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$# && %{REQUEST_FILENAME} =~ m#\.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$# && -f %{REQUEST_FILENAME} && %{CONTENT_TYPE} =~ m#^(?:image/|font/|application/(?:font-woff|vnd\.ms-fontobject|x-font-ttf|x-font-opentype))# && -z req('Authorization') && -z resp('Set-Cookie') && -z resp('Cache-Control')"
</IfModule>

<IfModule mod_deflate.c>
    <IfModule mod_filter.c>
        # Texto comercial somente. Nao comprimir PHP, painel, blog, RD ou leads.
        # mod_deflate negocia Accept-Encoding e acrescenta Vary automaticamente.
        <If "%{REQUEST_URI} !~ m#^/(?:blog|painel)(?:/|$)# && %{REQUEST_URI} !~ m#(?i:rdstation|rd-station|lead|\.php)(?:[^a-z]|$)# && -z req('Authorization')">
            AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml
        </If>
    </IfModule>
</IfModule>
